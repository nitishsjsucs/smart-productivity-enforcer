[project]
name = "smart-productivity-enforcer"
version = "0.1.0"
description = "AI-powered productivity enforcement system that monitors activity and blocks distractions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-generativeai>=0.8.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "python-dotenv>=1.0.0",
    "pywin32>=306",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pyautogui>=0.9.54",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
full = [
    "playwright>=1.40.0",
]

[project.scripts]
spe = "smart_productivity_enforcer.cli:app"
spe-daemon = "smart_productivity_enforcer.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smart_productivity_enforcer"]
