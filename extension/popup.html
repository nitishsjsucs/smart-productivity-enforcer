<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 14px;
      margin: 0;
      color: #333;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .status.connected {
      background: #E8F5E9;
      color: #2E7D32;
    }
    .status.disconnected {
      background: #FFEBEE;
      color: #C62828;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .status.connected .status-dot {
      background: #4CAF50;
    }
    .status.disconnected .status-dot {
      background: #F44336;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .btn-primary {
      background: #2196F3;
      color: white;
    }
    .btn-primary:hover {
      background: #1976D2;
    }
    .info {
      margin-top: 12px;
      padding: 10px;
      background: #F5F5F5;
      border-radius: 6px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Smart Productivity Enforcer</h1>
  </div>
  
  <div id="status" class="status disconnected">
    <div class="status-dot"></div>
    <span id="status-text">Disconnected</span>
  </div>
  
  <button id="reconnect" class="btn btn-primary">Reconnect</button>
  
  <div class="info">
    <strong>How it works:</strong><br>
    This extension sends your tab URLs to the productivity enforcer, which closes unproductive tabs during focus sessions.
  </div>

  <script src="popup.js"></script>
</body>
</html>
